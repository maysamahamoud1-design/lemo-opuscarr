<!doctype html>
<html><head><meta charset="utf-8"><title>Fahaan icon</title>
<style>@font-face{font-family:'Montserrat';src:url('../fonts/Montserrat.ttf') format('truetype');font-weight:100 900;}
html,body{margin:0;background:#fff}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script type="module">
import { drawIcon } from '../icon.js';
const cv = document.getElementById('c'); cv.width = innerWidth; cv.height = innerHeight; const g = cv.getContext('2d');
await document.fonts.load('800 100px Montserrat');
const Q = new URLSearchParams(location.search);
window.DUR = 1; window.render = () => { g.clearRect(0, 0, cv.width, cv.height); if (Q.get('bg')) { g.fillStyle = Q.get('bg'); g.fillRect(0, 0, cv.width, cv.height); } else { g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height); } drawIcon(g, cv.width / 2, cv.height / 2, cv.width * (Q.get('full') ? 1 : .86), { shadow: !Q.get('full') }); };
window.READY = true;
</script></body></html>
