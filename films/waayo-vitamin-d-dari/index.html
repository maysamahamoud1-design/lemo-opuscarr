<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><title>Waayo? Fiitamiin D</title>
<style>
@font-face { font-family: "Montserrat"; src: url(fonts/Montserrat.ttf); font-weight: 100 900; }
@font-face { font-family: "Montserrat"; src: url(fonts/Vazirmatn.ttf); font-weight: 100 900; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+2026; }
@font-face { font-family: "DM Mono"; src: url(fonts/Vazirmatn.ttf); font-weight: 100 900; unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
@font-face { font-family: "DM Mono"; src: url(fonts/DMMono-Medium.ttf); font-weight: 500; }
html,body { margin:0; background:#fbf8f1; overflow:hidden; }
canvas { display:block; width:1080px; height:1920px; }
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Persian text is drawn right to left; everything else keeps the engine's left-to-right layout.
(() => { const P = CanvasRenderingContext2D.prototype, F = P.fillText, AR = /[\u0600-\u06FF]/;
  P.fillText = function (t, x, y, ...m) { if (!AR.test(t)) return F.call(this, t, x, y, ...m);
    const d = this.direction, a = this.textAlign; this.direction = 'rtl';
    if (a === 'start') this.textAlign = 'left'; else if (a === 'end') this.textAlign = 'right';
    const r = F.call(this, t, x, y, ...m); this.direction = d; this.textAlign = a; return r; }; })();
</script>
<script src="engine.js"></script>
<script src="picto.js"></script>
<script src="icon.js"></script>
<script src="geo.js"></script>
<script src="timeline.js"></script>
<script src="voices/words.js"></script>
<script>
Promise.all(['900 40px Montserrat', '800 40px Montserrat', '500 20px "DM Mono"'].map((f) => document.fonts.load(f, 'Aa?·چرا'))).then(() => {
  const s = document.createElement('script'); s.src = 'film.js';
  s.onload = () => { window.render(0); window.READY = true; }; document.body.appendChild(s);
});
</script>
</body></html>
